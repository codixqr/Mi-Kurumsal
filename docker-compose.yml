services:
  postgres:
    image: postgres:16
    container_name: mi_kurumsal_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mikurumsal_crm
    ports:
      - "5432:5432"
    volumes:
      - mi_kurumsal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mikurumsal_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mi_kurumsal_pg_data:
